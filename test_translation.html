<!DOCTYPE html>
<html>
<head>
    <title>Test API MyMemory</title>
</head>
<body>
    <h1>Test API Translation</h1>
    <button onclick="testMyMemoryAPI()">Test MyMemory API</button>
    <div id="result"></div>

    <script>
        async function testMyMemoryAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                // Test direct de l'API MyMemory
                const testText = "Chicken curry with vegetables";
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(testText)}&langpair=en|fr`;
                
                console.log('🌐 Test URL:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📡 Réponse API:', data);
                
                if (data && data.responseData && data.responseData.translatedText) {
                    resultDiv.innerHTML = `
                        <h3>✅ Succès!</h3>
                        <p><strong>Texte original:</strong> ${testText}</p>
                        <p><strong>Traduction:</strong> ${data.responseData.translatedText}</p>
                        <p><strong>Score:</strong> ${data.responseData.match}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `❌ Erreur: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                console.error('❌ Erreur test API:', error);
                resultDiv.innerHTML = `❌ Erreur: ${error.message}`;
            }
        }
    </script>
</body>
</html>
